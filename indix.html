
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMED AI 49</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e1c;color:#fff;font-family:Arial,sans-serif}
header{padding:22px;background:#111c30;border-bottom:1px solid #263b59}
h1{margin:0;color:#42d5ff}
header p{color:#a8b8cc}
main{max-width:1000px;margin:auto;padding:20px}
.panel{background:#121e32;border:1px solid #293c59;border-radius:15px;padding:18px;margin-bottom:18px}
.status{color:#ffd166;font-size:14px}
button,select{padding:12px;border:0;border-radius:8px;cursor:pointer}
button{background:#35c8ed;color:#06111d;font-weight:bold}
select,input{background:#202f48;color:white;border:1px solid #38506e}
select{width:100%;margin:10px 0}
.chat{height:350px;overflow-y:auto;background:#080f1e;padding:14px;border-radius:10px}
.msg{padding:11px;margin:9px 0;border-radius:10px;white-space:pre-wrap;line-height:1.5}
.user{background:#203e59}
.ai{background:#1a2940}
.controls{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;padding:13px;border-radius:8px}
.small{color:#9aacc2;font-size:13px}
button:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<header>
<h1>AMED AI 49</h1>
<p>Yapay Zekâ Şirket Yönetim Merkezi</p>
</header>
<main>
<section class="panel">
<h2>Yönetim Merkezi</h2>
<p>AMED AI sistemine hoş geldin.</p>
<p class="status" id="status">Model henüz yüklenmedi.</p>
<button id="load" onclick="loadModel()">Yapay Zekâyı Başlat</button>
<p class="small" id="progress">Model: Qwen3 0.6B</p>
</section>

<section class="panel">
<h2>Uzmanlık Alanı</h2>
<select id="mode">
<option value="Amed">Amed - Genel Müdür</option>
<option value="Nasrettin">Nasrettin - E-ticaret</option>
<option value="Mustafa">Mustafa - Strateji</option>
<option value="Mehmet">Mehmet - Teknoloji</option>
<option value="Ali">Ali - Operasyon</option>
<option value="Selçuk">Selçuk - Araştırma</option>
<option value="Ağit">Ağit - Analiz</option>
</select>
<p class="small">Tek yapay zekâ, seçilen uzmanlık alanına göre cevap verir.</p>
</section>

<section class="panel">
<h2>AMED AI ile Sohbet</h2>
<div class="chat" id="chat">
<div class="msg ai">AMED: Merhaba! Ben Amed. Nasıl yardımcı olabilirim?</div>
</div>
<div class="controls">
<input id="message" placeholder="Amed'e mesaj yaz...">
<button id="send" onclick="sendMessage()">Gönder</button>
</div>
</section>
</main>

<script type="module">
import {CreateMLCEngine} from
"https://esm.run/@mlc-ai/web-llm";

const MODEL="Qwen3-0.6B-q4f16_1-MLC";
let engine=null;
let busy=false;

const status=document.getElementById("status");
const progress=document.getElementById("progress");
const chat=document.getElementById("chat");
const send=document.getElementById("send");

const prompts={
Amed:"Sen AMED AI'sın. Genel müdürsün. Türkçe konuşur, bütün konuları değerlendirir ve kullanıcıya yardımcı olursun.",
Nasrettin:"Sen Nasrettin'sin. E-ticaret, Amazon, Etsy, Printful ve pazar araştırması uzmanısın.",
Mustafa:"Sen Mustafa'sın. Strateji, iş geliştirme ve fırsat analizi uzmanısın.",
Mehmet:"Sen Mehmet'sin. Yazılım, teknoloji ve dijital sistemler uzmanısın.",
Ali:"Sen Ali'sin. Operasyon, organizasyon ve iş süreçleri uzmanısın.",
Selçuk:"Sen Selçuk'sun. Araştırma ve bilgi değerlendirme uzmanısın. Bilmediğin bilgiyi uydurma.",
Ağit:"Sen Ağit'sin. Verileri, maliyetleri ve iş sonuçlarını analiz eden uzmansın."
};

let history=[];

window.loadModel=async function(){
if(engine)return;
const btn=document.getElementById("load");
btn.disabled=true;
status.textContent="Yapay zekâ hazırlanıyor...";
try{
engine=await CreateMLCEngine(MODEL,{
initProgressCallback:(p)=>{
progress.textContent=p.text;
}
});
status.textContent="AMED AI hazır!";
progress.textContent="Model başarıyla yüklendi.";
}catch(e){
status.textContent="Model yüklenemedi.";
progress.textContent="Hata: "+e.message;
btn.disabled=false;
}
};

function addMessage(text,who){
const div=document.createElement("div");
div.className="msg "+who;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

window.sendMessage=async function(){
const input=document.getElementById("message");
const text=input.value.trim();
if(!text||busy)return;

if(!engine){
status.textContent="Önce Yapay Zekâyı Başlat düğmesine bas.";
return;
}

busy=true;
send.disabled=true;
input.value="";
addMessage("SEN: "+text,"user");

const mode=document.getElementById("mode").value;
const system=prompts[mode];

history.push({role:"user",content:text});
if(history.length>12)history=history.slice(-12);

try{
const result=await engine.chat.completions.create({
messages:[
{role:"system",content:system},
...history
],
temperature:0.7,
max_tokens:400
});

const answer=result.choices[0].message.content;
history.push({role:"assistant",content:answer});
addMessage(mode+": "+answer,"ai");
}catch(e){
addMessage("AMED: Cevap oluşturulamadı: "+e.message,"ai");
history.pop();
}
busy=false;
send.disabled=false;
input.focus();
};

document.getElementById("message").addEventListener("keydown",e=>{
if(e.key==="Enter")window.sendMessage();
});
</script>
</body>
</html>
